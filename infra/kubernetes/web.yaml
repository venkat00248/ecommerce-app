apiVersion: apps/v1
kind: Deployment
metadata: { name: ecommerce-web }
spec:
  replicas: 2
  selector: { matchLabels: { app: ecommerce-web } }
  template:
    metadata: { labels: { app: ecommerce-web } }
    spec:
      containers:
        - name: web
          image: REGION-docker.pkg.dev/PROJECT/ecommerce/web:latest
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: ecommerce-web }
spec:
  type: LoadBalancer
  selector: { app: ecommerce-web }
  ports: [{ port: 80, targetPort: 80 }]