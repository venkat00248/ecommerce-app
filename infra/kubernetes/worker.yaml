apiVersion: apps/v1
kind: Deployment
metadata: { name: ecommerce-worker }
spec:
  replicas: 1
  selector: { matchLabels: { app: ecommerce-worker } }
  template:
    metadata: { labels: { app: ecommerce-worker } }
    spec:
      containers:
        - name: worker
          image: REGION-docker.pkg.dev/PROJECT/ecommerce/worker:latest
          envFrom: [{ secretRef: { name: ecommerce-secrets } }]