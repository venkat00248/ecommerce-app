apiVersion: apps/v1
kind: Deployment
metadata: { name: ecommerce-api }
spec:
  replicas: 2
  selector: { matchLabels: { app: ecommerce-api } }
  template:
    metadata: { labels: { app: ecommerce-api } }
    spec:
      containers:
        - name: api
          image: REGION-docker.pkg.dev/PROJECT/ecommerce/api:latest
          ports: [{ containerPort: 4000 }]
          envFrom: [{ secretRef: { name: ecommerce-secrets } }]
---
apiVersion: v1
kind: Service
metadata: { name: ecommerce-api }
spec:
  selector: { app: ecommerce-api }
  ports: [{ port: 4000, targetPort: 4000 }]